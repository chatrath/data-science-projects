name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  RUN_LIVE_EVAL: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  nl-ops:
    name: NL-Ops tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nl-ops-mvp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nl-ops-mvp/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test safety, execution, auditing, and offline evaluation
        run: python -m pytest tests test_enterprise_eval.py -q -p no:cacheprovider

  cohort:
    name: Cohort tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cohort-learning-companion
    env:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cohort-learning-companion/requirements.txt
      - name: Install English OCR language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr-eng
          test -f "$TESSDATA_PREFIX/eng.traineddata"
      - name: Install CPU-only model dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test without private corpus, database, or live models
        run: python -m unittest discover -s tests -q

  dashboard:
    name: Dashboard smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-models-dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ai-models-dashboard/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q app.py adoption_insights.py model_comparison.py live_model_docs.py src
      - name: Verify Streamlit startup without live AI calls
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run(timeout=45)
          assert not app.exception, [error.message for error in app.exception]
          PY
